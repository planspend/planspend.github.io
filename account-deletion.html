<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帳號刪除｜安心花 PlanSpend</title><style>body{margin:0;background:#f7f6f0;color:#26322c;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:680px;margin:auto;padding:50px 22px}section{background:#fff;border:1px solid #e5e1d7;border-radius:20px;padding:24px;margin:16px 0}h1,a{color:#28745c}</style></head><body><main><h1>帳號刪除說明</h1><section><h2>在 App 內刪除</h2><p>登入後前往「設定 → 隱私與帳號 → 永久刪除帳號」，依兩次確認提示完成刪除。</p></section><section><h2>無法登入時</h2><p>請使用登入帳號可接收信件的電子郵件寄信至 <a href="mailto:planspend.app@gmail.com">planspend.app@gmail.com</a>，主旨填寫「PlanSpend 帳號刪除請求」。為避免冒用，我們可能要求驗證身分。</p></section><section><h2>刪除範圍</h2><p>登入帳號、成員身分、問題回報及附件，以及由該帳號建立的消費與儲蓄紀錄會被刪除。共同帳本仍有其他成員時，管理權可能移交；只有該使用者時，帳本及其內容會一併刪除。</p></section><p><a href="index.html">返回首頁</a></p></main></body></html>
